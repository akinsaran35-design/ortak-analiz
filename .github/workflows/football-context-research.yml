name: V5.23 historical football context
on:
  pull_request:
    paths:
      - 'scripts/football_context_research.py'
      - 'scripts/test_football_context_research.py'
      - 'scripts/football_statistics_pilot.py'
      - '.github/workflows/football-context-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_football_statistics_pilot.py
      - run: python scripts/test_football_context_research.py
      - run: python scripts/football_context_research.py
      - uses: actions/upload-artifact@v4
        with:
          name: football-context-research
          path: football_context_research.json
          if-no-files-found: error
          retention-days: 7
