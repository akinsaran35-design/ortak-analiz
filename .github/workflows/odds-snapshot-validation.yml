name: V6.76 odds snapshot integrity
on:
  pull_request:
    paths:
      - 'scripts/fetch_odds.py'
      - 'scripts/odds_snapshot_validation.py'
      - 'scripts/test_odds_snapshot_validation.py'
      - '.github/workflows/odds-snapshot-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/fetch_odds.py scripts/odds_snapshot_validation.py
      - run: python scripts/test_odds_snapshot_validation.py
      - run: python scripts/market_data_health.py --self-test
