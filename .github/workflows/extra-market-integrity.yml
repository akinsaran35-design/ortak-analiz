name: V6.84 extra market integrity
on:
  pull_request:
    paths:
      - 'scripts/fetch_extra_markets.py'
      - 'scripts/test_extra_markets.py'
      - '.github/workflows/extra-market-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_extra_markets.py
