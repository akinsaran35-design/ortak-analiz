name: V5.31 historical metric coverage
on:
  pull_request:
    paths:
      - 'scripts/historical_metric_coverage.py'
      - 'scripts/test_historical_metric_coverage.py'
      - '.github/workflows/historical-metric-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_historical_metric_coverage.py
      - run: python scripts/historical_metric_coverage.py
      - uses: actions/upload-artifact@v4
        with:
          name: historical-metric-coverage
          path: historical_metric_coverage.json
          if-no-files-found: error
          retention-days: 7
