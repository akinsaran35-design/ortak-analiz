name: V6.14 OpenFootball third-source audit
on:
  pull_request:
    paths:
      - 'scripts/openfootball_third_source_audit.py'
      - '.github/workflows/openfootball-third-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/openfootball_third_source_audit.py --self-test
      - run: python3 scripts/openfootball_third_source_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openfootball-third-source-audit
          path: openfootball_third_source_audit.json
