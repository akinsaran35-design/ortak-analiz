name: V5.47 historical goal model validation
on:
  pull_request:
    paths:
      - 'scripts/historical_goal_validation.py'
      - 'scripts/test_historical_goal_validation.py'
      - '.github/workflows/historical-goal-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_historical_goal_validation.py
      - run: python scripts/historical_goal_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: historical-goal-validation
          path: historical_goal_validation.json
          if-no-files-found: error
          retention-days: 7
