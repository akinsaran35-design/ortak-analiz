name: V4.96 Mobile Browser
on:
  pull_request:
    paths:
      - 'index.html'
      - 'mobile-v487.js'
      - 'direct-radar-v727.js'
      - 'scripts/test_direct_radar.js'
      - 'scripts/probe_direct_radar_browser.js'
      - 'mobile-v487.css'
      - 'money-v497.js'
      - 'scripts/test_mobile_browser.js'
      - 'scripts/team_logo_catalog.py'
      - 'team_logos.json'
      - '.github/workflows/mobile-browser.yml'
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/team_logo_catalog.py
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node --check direct-radar-v727.js && node scripts/test_direct_radar.js
      - run: node scripts/probe_direct_radar_browser.js
      - run: |
          python3 -m http.server 8765 > /tmp/oa-browser-server.log 2>&1 &
          for i in 1 2 3 4 5; do curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break; sleep 1; done
          node scripts/test_mobile_browser.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-reference-preview
          path: |
            mobile-reference-*.png
            team_logos.json
          if-no-files-found: ignore
          retention-days: 7
