name: V5.43 TFF fixture link discovery
on:
  pull_request:
    paths:
      - 'scripts/tff_fixture_link_discovery.py'
      - 'scripts/test_tff_fixture_link_discovery.py'
      - '.github/workflows/tff-fixture-link-discovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_tff_fixture_link_discovery.py
      - run: python scripts/tff_fixture_link_discovery.py
      - uses: actions/upload-artifact@v4
        with:
          name: tff-fixture-link-discovery
          path: tff_fixture_link_discovery.json
          if-no-files-found: error
          retention-days: 7
