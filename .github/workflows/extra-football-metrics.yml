name: V7.07 extra football historical metrics
on:
  pull_request:
    paths:
      - 'scripts/extra_historical_metric_coverage.py'
      - 'scripts/test_extra_historical_metric_coverage.py'
      - 'scripts/extra_team_statistics.py'
      - 'scripts/test_extra_team_statistics.py'
      - 'scripts/extra_fixture_context.py'
      - 'scripts/test_extra_fixture_context.py'
      - 'scripts/extra_fixture_aliases.py'
      - 'scripts/test_extra_fixture_aliases.py'
      - '.github/workflows/extra-football-metrics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Offline coverage regression
        run: |
          python3 scripts/test_extra_historical_metric_coverage.py
          python3 scripts/test_extra_team_statistics.py
          python3 scripts/test_extra_fixture_context.py
          python3 scripts/test_extra_fixture_aliases.py
      - name: Collect historical public-source coverage
        run: |
          python3 scripts/extra_historical_metric_coverage.py
          python3 scripts/extra_fixture_context.py
      - uses: actions/upload-artifact@v4
        with:
          name: extra-football-historical-coverage
          path: |
            extra_historical_metric_coverage.json
            extra_fixture_context.json
