name: V7.26 Live radar display tests
on:
  pull_request:
    paths:
      - 'mobile-v487.js'
      - 'scripts/test_live_radar_display.js'
      - 'index.html'
      - 'sw.js'
      - '.github/workflows/live-radar-display.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check mobile-v487.js
      - run: node scripts/test_live_radar_display.js
