name: V6.19 November 27 match review
on:
  pull_request:
    paths:
      - 'scripts/nov27_match_review.py'
      - 'research/nov27-match-review.json'
      - '.github/workflows/nov27-match-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/nov27_match_review.py
      - uses: actions/upload-artifact@v4
        with:
          name: nov27-match-review
          path: nov27_match_review_result.json
