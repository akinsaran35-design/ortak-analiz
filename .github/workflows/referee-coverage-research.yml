name: V5.24 all league referee coverage
on:
  pull_request:
    paths:
      - 'scripts/referee_coverage_research.py'
      - 'scripts/test_referee_coverage_research.py'
      - '.github/workflows/referee-coverage-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_referee_coverage_research.py
      - run: python scripts/referee_coverage_research.py
      - uses: actions/upload-artifact@v4
        with:
          name: referee-coverage-research
          path: referee_coverage_research.json
          if-no-files-found: error
          retention-days: 7
