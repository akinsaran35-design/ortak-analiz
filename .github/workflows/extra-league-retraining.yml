name: V6.53 historical retraining research
on:
  pull_request:
    paths:
      - 'scripts/extra_league_retraining.py'
      - 'scripts/test_extra_league_retraining.py'
      - '.github/workflows/extra-league-retraining.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'xgboost==2.1.4' 'numpy==2.2.6' 'scipy==1.15.3' 'scikit-learn==1.6.1' 'joblib==1.4.2' 'threadpoolctl==3.6.0'
      - run: python scripts/test_extra_league_retraining.py
      - run: python scripts/extra_league_retraining.py
      - uses: actions/upload-artifact@v4
        with:
          name: extra-retraining-report
          path: extra_retraining_report.json
          if-no-files-found: error
          retention-days: 30
