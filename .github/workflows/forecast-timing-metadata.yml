name: V6.82 forecast timing metadata
on:
  pull_request:
    paths:
      - 'scripts/daily_analysis.py'
      - 'scripts/track_performance.py'
      - 'scripts/test_track_performance.py'
      - '.github/workflows/forecast-timing-metadata.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/daily_analysis.py scripts/track_performance.py
      - run: python scripts/test_track_performance.py
