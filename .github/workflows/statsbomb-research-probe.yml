name: V6.51d StatsBomb research source audit
on:
  pull_request:
    paths:
      - 'scripts/statsbomb_research_probe.py'
      - 'scripts/test_statsbomb_research_probe.py'
      - '.github/workflows/statsbomb-research-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/test_statsbomb_research_probe.py
      - run: python scripts/statsbomb_research_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: statsbomb-research-report
          path: statsbomb_research_report.json
          if-no-files-found: ignore
          retention-days: 7
