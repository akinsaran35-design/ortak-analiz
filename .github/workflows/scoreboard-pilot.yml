name: V4.90 Scoreboard Pilot
on:
  pull_request:
    paths:
      - 'scripts/scoreboard_snapshot.py'
      - 'scripts/test_scoreboard_snapshot.py'
      - 'scripts/scoreboard_source_probe.py'
      - '.github/workflows/scoreboard-pilot.yml'
jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_scoreboard_snapshot.py
      - run: python scripts/scoreboard_snapshot.py
      - run: python scripts/scoreboard_source_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: scoreboard-snapshot
          path: |
            scoreboard_snapshot.json
            scoreboard_source_probe.json
          retention-days: 7
