name: V7.22 Public football summary coverage
on:
  pull_request:
    paths:
      - 'scripts/public_summary_coverage.py'
      - 'scripts/test_public_summary_coverage.py'
      - 'scripts/referee_team_name_evidence.py'
      - '.github/workflows/public-summary-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test_public_summary_coverage.py
      - run: python3 scripts/public_summary_coverage.py
