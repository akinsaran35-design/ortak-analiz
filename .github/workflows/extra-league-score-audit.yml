name: V6.23 additional league score audit
on:
  pull_request:
    paths:
      - 'scripts/extra_league_score_audit.py'
      - 'scripts/test_extra_league_score_audit.py'
      - '.github/workflows/extra-league-score-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/test_extra_league_score_audit.py
      - run: python scripts/extra_league_score_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: extra-league-score-audit
          path: extra_league_score_audit.json
