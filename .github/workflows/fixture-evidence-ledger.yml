name: V6.1 fixture evidence ledger
on:
  pull_request:
    paths:
      - scripts/fixture_evidence_ledger.py
      - .github/workflows/fixture-evidence-ledger.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fixture_evidence_ledger.py --self-test
