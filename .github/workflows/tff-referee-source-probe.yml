name: V5.42 official TFF referee source probe
on:
  pull_request:
    paths:
      - 'scripts/tff_referee_source_probe.py'
      - 'scripts/test_tff_referee_source_probe.py'
      - '.github/workflows/tff-referee-source-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_tff_referee_source_probe.py
      - run: python scripts/tff_referee_source_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: tff-referee-source-probe
          path: tff_referee_source_probe.json
          if-no-files-found: error
          retention-days: 7
