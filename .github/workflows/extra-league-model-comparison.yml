name: V6.54 historical model comparison
on:
  pull_request:
    paths:
      - 'scripts/extra_league_model_comparison.py'
      - 'scripts/test_extra_league_model_comparison.py'
      - '.github/workflows/extra-league-model-comparison.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'xgboost==2.1.4' 'lightgbm==4.6.0' 'catboost==1.2.8' 'numpy==2.2.6' 'scipy==1.15.3' 'scikit-learn==1.6.1' 'joblib==1.4.2' 'threadpoolctl==3.6.0'
      - run: python scripts/test_extra_league_model_comparison.py
      - run: python scripts/extra_league_model_comparison.py
      - uses: actions/upload-artifact@v4
        with:
          name: extra-model-comparison
          path: extra_model_comparison.json
          if-no-files-found: error
          retention-days: 30
