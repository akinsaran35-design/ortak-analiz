name: V5.20 live publication verification
on:
  pull_request:
    paths:
      - 'scripts/live_performance_research.py'
      - 'scripts/test_live_performance_research.py'
      - 'scripts/live_rate_link.py'
      - 'scripts/test_live_rate_link.py'
      - 'scripts/live_score_scenario.py'
      - 'scripts/test_live_score_scenario.py'
      - 'scripts/live_analysis_quality.py'
      - 'scripts/test_live_analysis_quality.py'
      - 'scripts/live_refresh_snapshot.py'
      - 'scripts/test_live_refresh_snapshot.py'
      - 'scripts/live_statistics_pilot.py'
      - 'scripts/scoreboard_snapshot.py'
      - '.github/workflows/live-refresh-pilot.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-refresh-pilot.yml'
      - 'scripts/live_*py'
  schedule:
    # Staggered 15-minute pilot during European football hours (13:07-02:52 TRT).
    - cron: '7,22,37,52 10-23 * * *'
permissions:
  contents: read
concurrency:
  group: live-refresh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_live_refresh_snapshot.py
      - run: python scripts/test_live_analysis_quality.py
      - run: python scripts/test_live_score_scenario.py
      - run: python scripts/test_live_rate_link.py
      - run: python scripts/test_live_performance_research.py
      - run: python scripts/live_refresh_snapshot.py
      - run: python scripts/live_analysis_quality.py
      - run: python scripts/live_rate_link.py
      - name: Exercise publication archive CLI without writing remote data
        run: |
          mkdir -p /tmp/oa-publication-check
          python scripts/live_performance_research.py live_rate_link.json /tmp/oa-publication-check/archive.json verified_results.json /tmp/oa-publication-check/performance.json
          python -c 'import json; from pathlib import Path; p=Path("/tmp/oa-publication-check"); a=json.loads((p/"archive.json").read_text()); r=json.loads((p/"performance.json").read_text()); assert r["recorded"]==len(a) and r["predictionsEnabled"] is False and r["modelCalibrated"] is False'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-refresh-snapshot
          path: |
            live_refresh_snapshot.json
            live_analysis_quality.json
            live_rate_link.json
          if-no-files-found: error
          retention-days: 1
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-data
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: research-code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: live-refresh-snapshot
          path: /tmp/oa-live
      - name: Update observation and research archive on dedicated branch
        run: |
          cp /tmp/oa-live/live_analysis_quality.json live_analysis_quality.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python research-code/scripts/live_performance_research.py /tmp/oa-live/live_rate_link.json live_scenario_archive.json research-code/verified_results.json live_performance_research.json
          git add live_analysis_quality.json live_scenario_archive.json live_performance_research.json
          if ! git diff --cached --quiet; then
            git commit -m "Update live observations and research archive"
            git push origin HEAD:live-data
          fi
          git fetch origin live-data
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          for f in live_analysis_quality.json live_scenario_archive.json live_performance_research.json; do
            git show FETCH_HEAD:"$f" | cmp - "$f"
          done
          echo "Verified remote publication: $(git rev-parse FETCH_HEAD)"
