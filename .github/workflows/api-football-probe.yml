name: V7.04 API-Football access probe
on:
  pull_request:
    paths:
      - 'scripts/api_football_access_probe.py'
      - 'scripts/test_api_football_access_probe.py'
      - 'scripts/api_football_sample_quality.py'
      - 'scripts/test_api_football_sample_quality.py'
      - 'scripts/backup_source_router.py'
      - 'scripts/test_backup_source_router.py'
      - '.github/workflows/api-football-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: api-football-access-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Offline access and quota tests
        run: |
          python3 scripts/test_api_football_access_probe.py
          python3 scripts/test_api_football_sample_quality.py
          python3 scripts/test_backup_source_router.py
      - name: Verify backup access without exposing credentials
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python3 scripts/api_football_access_probe.py
