name: V6.86 API budget planning
on:
  pull_request:
    paths:
      - 'scripts/extra_market_budget_plan.py'
      - 'scripts/test_extra_market_budget_plan.py'
      - '.github/workflows/extra-market-budget-plan.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_extra_market_budget_plan.py
      - run: python scripts/extra_market_budget_plan.py
      - uses: actions/upload-artifact@v4
        with:
          name: extra-market-budget-plan
          path: extra_market_budget_plan.json
