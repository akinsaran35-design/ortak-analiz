name: V5.35 research publication validation
on:
  pull_request:
    paths:
      - 'scripts/football_context_manifest.py'
      - 'scripts/test_football_context_manifest.py'
      - '.github/workflows/daily.yml'
      - '.github/workflows/research-publication.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_football_context_manifest.py
      - run: python scripts/test_football_context_research.py
      - run: python scripts/test_historical_metric_coverage.py
      - run: |
          python scripts/h2h_history_research.py --apply
          python scripts/football_context_research.py
          python scripts/historical_metric_coverage.py
          python scripts/test_chronological_statistics_research.py
          python scripts/chronological_statistics_research.py
          python scripts/football_context_manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: football-context-publication
          path: |
            football_context_manifest.json
            football_context_research.json
            historical_metric_coverage.json
            chronological_statistics_research.json
            h2h_history_research.json
          if-no-files-found: error
          retention-days: 7
