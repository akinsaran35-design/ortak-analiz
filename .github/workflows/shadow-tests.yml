name: V4.8 Shadow Tests

on:
  push:
    branches: [ortak-analiz-v4-8]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile shadow modules
        run: python -m py_compile scripts/shadow_coupon.py scripts/shadow_results.py scripts/shadow_performance.py
      - name: Test settlement
        run: python scripts/test_shadow_performance.py

      - name: Test research market report
        run: |
          python -m py_compile scripts/market_analysis_15.py
          python scripts/market_analysis_15.py
          python -c 'import json; r=json.load(open("market_analysis_15.json")); assert r["market"] == "1.5" and r["modelCalibrated"] is False and r["decision"] == "PAS" and r["comparedCount"] == len(r["rows"])'

      - name: Test V4.9 extra markets
        run: |
          python -m py_compile scripts/fetch_extra_markets.py
          ODDS_API_KEY="" python scripts/fetch_extra_markets.py
          python -c 'import json; r=json.load(open("extra_markets.json")); assert r["decision"] == "PAS" and r["eventCount"] == 0 and "missing_key" in r["errors"]'

      - name: Test V4.9 simulated API
        run: python scripts/test_extra_markets.py

      - name: V4.9 controlled live pilot
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ortak-analiz-v4-8'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/fetch_extra_markets.py

      - name: Upload V4.9 pilot report
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ortak-analiz-v4-8'
        uses: actions/upload-artifact@v4
        with:
          name: extra-markets-pilot
          path: extra_markets.json
          retention-days: 7

      - name: Test V4.10 odds archive
        run: |
          python -m py_compile scripts/archive_extra_markets.py
          python scripts/test_archive_extra_markets.py
      - name: Test V4.11 market movement
        run: |
          python -m py_compile scripts/market_movement.py
          python scripts/test_market_movement.py
      - name: Test V4.12 model market
        run: |
          python -m py_compile scripts/model_market.py
          python scripts/test_model_market.py
      - name: Test V4.13 unified decision
        run: |
          python -m py_compile scripts/unified_decision.py
          python scripts/test_unified_decision.py
      - name: Test V4.14 dashboard
        run: |
          node --check dashboard-v414.js
          grep -F 'src="./dashboard-v414.js"' index.html

      - name: Test V4.17 calibration
        run: python scripts/test_calibration.py

      - name: Test V4.18 Dixon Coles
        run: python scripts/test_dixon_coles.py

      - name: Test V4.19 Monte Carlo
        run: python scripts/test_monte_carlo.py

      - name: Test V4.20 research report
        run: python scripts/test_model_research.py

      - name: Test V4.21 score probabilities
        run: python scripts/test_score_model.py

      - name: Test V4.22 historical archive
        run: python scripts/test_historical_data.py

      - name: Test source discovery
        run: python scripts/test_source_discovery.py

      - name: Test historical conflict audit
        run: python scripts/test_history_audit.py

      - name: Test historical text pilot
        run: python scripts/test_historical_text.py

      - name: Test chronological split
        run: python scripts/test_historical_split.py

      - name: Test archive reconciliation
        run: python scripts/test_historical_reconcile.py

      - name: Test historical baseline
        run: python scripts/test_historical_baseline.py

      - name: Test source freshness
        run: python scripts/test_historical_freshness.py

      - name: Test OpenLigaDB pilot
        run: python scripts/test_openliga_pilot.py
      - name: Weighted research tests
        run: python scripts/test_historical_weighted.py
      - name: Historical comparison tests
        run: python scripts/test_historical_comparison.py

      - name: Historical tuning tests
        run: python scripts/test_historical_tuning.py

      - name: League strength tests
        run: python scripts/test_historical_strength.py

      - name: Historical ROI tests
        run: python scripts/test_historical_roi.py

      - name: V4.42 Opponent strength tests
        run: python scripts/test_historical_opponent.py

      - name: V4.47 weekend readiness tests
        run: |
          node --check weekend-readiness.js
          node scripts/test_weekend_readiness.js
          grep -F 'src="./weekend-readiness.js"' index.html

      - name: V4.48 fixture coverage tests
        run: python scripts/test_daily_coverage.py

      - name: V4.50 league configuration tests
        run: |
          python -m py_compile scripts/league_config.py scripts/daily_analysis.py scripts/fetch_odds.py scripts/match_odds.py scripts/backtest.py scripts/track_performance.py scripts/shadow_results.py
          python scripts/test_league_config.py

      - name: V4.51 Turkey adapter tests
        run: python scripts/test_turkey_source.py
      - name: V4.51 Turkey public result source smoke
        run: python scripts/turkey_source.py

      - name: V4.54 fixture schema tests
        run: |
          python scripts/test_fixture_schema.py
          python scripts/test_track_performance.py

      - name: V4.57 matching replay and regression
        run: |
          python scripts/test_match_odds.py
          python scripts/replay_matching.py

      - name: V4.58 coverage display tests
        run: node scripts/test_weekend_readiness.js

      - name: V4.59 calendar corroboration tests and source replay
        run: |
          python scripts/test_fixture_reconciliation.py
          python scripts/fixture_reconciliation.py
      - name: Upload V4.59 research calendar report
        uses: actions/upload-artifact@v4
        with:
          name: fixture-reconciliation
          path: fixture_reconciliation.json
          retention-days: 7

      - name: V4.62 verified result settlement tests
        run: python scripts/test_verified_results.py

      - name: V4.63 automatic result source pilot
        run: |
          python scripts/test_results_source_pilot.py
          python scripts/results_source_pilot.py
      - name: Upload V4.63 result source report
        uses: actions/upload-artifact@v4
        with:
          name: results-source-pilot
          path: results_source_pilot.json
          retention-days: 7

      - name: V4.64 automatic results settlement tests
        run: python scripts/test_automatic_results.py

      - name: V4.65 nine league results source pilot
        run: |
          python scripts/test_nine_league_results_pilot.py
          python scripts/nine_league_results_pilot.py
      - name: Upload V4.65 nine league results audit
        uses: actions/upload-artifact@v4
        with:
          name: nine-league-results-pilot
          path: nine_league_results_pilot.json
          retention-days: 7

      - name: V4.67 multi league automatic results regression and replay
        run: |
          python scripts/test_multi_league_results.py
          python scripts/multi_league_results.py

      - name: V4.70 archive date audit
        run: |
          python scripts/test_archive_calendar_audit.py
          python scripts/archive_calendar_audit.py
      - name: Upload V4.70 archive date audit
        uses: actions/upload-artifact@v4
        with:
          name: archive-calendar-audit
          path: archive_calendar_audit.json
          retention-days: 7

      - name: V4.71 immutable date evidence tests and replay
        run: |
          python scripts/test_archive_calendar_evidence.py
          python scripts/archive_calendar_evidence.py
