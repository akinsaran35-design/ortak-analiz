name: V7.25 xG source catalog coverage
on:
  pull_request:
    paths:
      - 'scripts/xg_source_catalog.py'
      - 'scripts/test_xg_source_catalog.py'
      - '.github/workflows/xg-source-catalog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test_xg_source_catalog.py
      - run: python3 scripts/xg_source_catalog.py
