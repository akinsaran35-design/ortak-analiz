name: Historical archive V4.22
on:
  push:
    branches: [main]
    paths: ['.github/workflows/history.yml', 'scripts/historical_*.py', 'scripts/test_historical_*.py', 'scripts/source_discovery.py', 'scripts/openliga_pilot.py', 'scripts/test_openliga_pilot.py', 'scripts/dixon_coles.py']
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_historical_data.py
      - run: python scripts/historical_data.py
      - run: |
          python -c 'import json; r=json.load(open("historical_data.json")); print({k:v for k,v in r.items() if k!="matches"})' >> "$GITHUB_STEP_SUMMARY"
      - run: python scripts/test_source_discovery.py
      - run: python scripts/source_discovery.py
      - run: python scripts/test_historical_text.py
      - run: python scripts/historical_text.py
      - run: python scripts/test_historical_split.py
      - run: python scripts/historical_split.py
      - run: python scripts/test_historical_reconcile.py
      - run: python scripts/historical_reconcile.py
      - run: python scripts/test_historical_baseline.py
      - run: python scripts/historical_baseline.py
      - run: python scripts/test_historical_freshness.py
      - run: python scripts/historical_freshness.py
      - run: python scripts/test_openliga_pilot.py
      - run: python scripts/test_historical_tuning.py
      - run: python scripts/test_historical_strength.py
      - run: python scripts/openliga_pilot.py
      - run: python scripts/historical_multiyear.py
      - uses: actions/upload-artifact@v4
        with:
          name: historical-data
          path: |
            historical_data.json
            source_discovery.json
            historical_text.json
            historical_split.json
            historical_reconcile.json
            historical_baseline.json
            historical_freshness.json
            openliga_pilot.json
            openliga_baseline.json
            openliga_comparison.json
            openliga_tuning.json
            openliga_market_tuning.json
            openliga_multiyear.json
            openliga_strength.json
          retention-days: 7
