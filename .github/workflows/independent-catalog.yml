name: V5.66 independent catalog
on:
  pull_request:
    paths:
      - 'scripts/independent_catalog.py'
      - '.github/workflows/independent-catalog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/independent_catalog.py
      - uses: actions/upload-artifact@v4
        with:
          name: independent-catalog
          path: independent_catalog.json
