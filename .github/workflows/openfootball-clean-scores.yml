name: V6.18 OpenFootball clean score archive
on:
  pull_request:
    paths:
      - 'scripts/openfootball_clean_scores.py'
      - '.github/workflows/openfootball-clean-scores.yml'
      - 'research/openfootball/fixture-identity-evidence-2026-11-27.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/openfootball_clean_scores.py
      - uses: actions/upload-artifact@v4
        with:
          name: openfootball-clean-scores
          path: openfootball_clean_scores.json
          if-no-files-found: error
