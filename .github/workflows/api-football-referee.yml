name: V7.15 API-Football referee coverage
on:
  pull_request:
    paths:
      - 'scripts/api_football_referee_probe.py'
      - 'scripts/test_api_football_referee_probe.py'
      - '.github/workflows/api-football-referee.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: api-football-access-probe
  cancel-in-progress: false
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test_api_football_referee_probe.py
      - if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python3 scripts/api_football_referee_probe.py
