name: V6.0 market data health
on:
  pull_request:
    paths:
      - scripts/market_data_health.py
      - .github/workflows/market-data-health.yml
      - odds.json
      - market_movement.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/market_data_health.py --self-test
      - run: python scripts/market_data_health.py
      - uses: actions/upload-artifact@v4
        with:
          name: market-data-health
          path: market_data_health.json
