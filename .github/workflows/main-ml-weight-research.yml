name: V6.72 historical weight sensitivity
on:
  pull_request:
    paths:
      - 'scripts/main_ml_weight_research.py'
      - 'scripts/test_main_ml_weight_research.py'
      - '.github/workflows/main-ml-weight-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'catboost==1.2.8' 'numpy==2.2.6' 'scipy==1.15.3'
      - run: python scripts/test_main_ml_weight_research.py
      - run: python scripts/main_ml_weight_research.py
      - uses: actions/upload-artifact@v4
        with:
          name: main-ml-weight-research
          path: main_ml_weight_research.json
          if-no-files-found: error
          retention-days: 90
