name: V5.26 H2H historical coverage
on:
  pull_request:
    paths:
      - 'scripts/h2h_history_research.py'
      - 'scripts/test_h2h_history_research.py'
      - '.github/workflows/h2h-history-research.yml'
      - '.github/workflows/daily.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_football_form.py
      - run: python scripts/test_h2h_history_research.py
      - run: python scripts/h2h_history_research.py
      - uses: actions/upload-artifact@v4
        with:
          name: h2h-history-research
          path: h2h_history_research.json
          if-no-files-found: error
          retention-days: 7
