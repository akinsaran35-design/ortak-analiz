name: V6.50 xG source availability audit
on:
  pull_request:
    paths:
      - 'scripts/extra_xg_source_audit.py'
      - 'scripts/test_extra_xg_source_audit.py'
      - '.github/workflows/extra-xg-source-audit.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/extra_xg_source_audit.py'
      - 'scripts/test_extra_xg_source_audit.py'
      - '.github/workflows/extra-xg-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/test_extra_xg_source_audit.py
      - run: python scripts/extra_xg_source_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: extra-xg-source-audit
          path: extra_xg_source_audit.json
          if-no-files-found: error
          retention-days: 30
