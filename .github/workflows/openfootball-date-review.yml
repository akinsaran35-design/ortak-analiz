name: V6.15 OpenFootball date discrepancy review
on:
  pull_request:
    paths:
      - 'scripts/openfootball_date_review.py'
      - '.github/workflows/openfootball-date-review.yml'
      - 'research/openfootball/third-source-evidence-2026-11-27.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/openfootball_date_review.py --self-test
      - run: python3 scripts/openfootball_date_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openfootball-date-review
          path: openfootball_date_review.json
