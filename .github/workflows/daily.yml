name: Ortak Analiz Gunluk

on:
  schedule:
    - cron: '0 5,15 * * *'
    # Extra weekend snapshots at 11:10, 14:10, 16:10, 21:10 Istanbul time.
    # Keep the existing API quota guard; no continuous polling.
    - cron: '10 8,11,13,18 * * 6,0'
  workflow_dispatch:
  # Refresh after a deliberate pipeline or league configuration change.
  # Report-only commits do not match these paths.
  push:
    branches: [main]
    paths: ['.github/workflows/daily.yml', 'scripts/league_config.py', 'scripts/fixture_schema.py', 'scripts/daily_analysis.py', 'scripts/turkey_source.py', 'scripts/nine_league_results_pilot.py', 'scripts/football_statistics_pilot.py', 'scripts/prospective_validation.py', 'scripts/prospective_capture_window.py', 'verified_results.json', 'scripts/verified_results.py', 'scripts/multi_league_results.py', 'scripts/shadow_coupon.py']

concurrency:
  group: ortak-analiz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Odds API baglanti testi
        if: github.ref == 'refs/heads/ortak-analiz-v2-5'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/odds_probe.py

      - name: Uluslararasi oranlari al
        if: github.ref != 'refs/heads/ortak-analiz-v2-8' && github.ref != 'refs/heads/ortak-analiz-v2-9' && github.ref != 'refs/heads/ortak-analiz-v3-0'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_OPTIONAL_REFRESH: ${{ github.ref == 'refs/heads/main' && github.event_name == 'schedule' && github.event.schedule == '10 8,11,13,18 * * 6,0' }}
        run: python scripts/fetch_odds.py

      - name: V7.05 quota guarded backup routing
        if: github.ref == 'refs/heads/main'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python scripts/test_backup_source_router.py
          python scripts/backup_source_router.py

      - name: V6.89 quota-protected extra market research
        if: github.ref == 'refs/heads/main' && github.event_name == 'schedule' && github.event.schedule == '0 5,15 * * *'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/test_extra_markets.py
          python scripts/test_archive_extra_markets.py
          python scripts/fetch_extra_markets.py
          python scripts/archive_extra_markets.py

      - name: V4.84 dual-source settlement tests
        run: |
          python scripts/test_track_performance.py
          python scripts/test_verified_results.py
          python scripts/test_calendar_duplicate_guard.py

      - name: Gunluk analizi calistir
        run: python scripts/daily_analysis.py

      - name: V5.26 H2H history enrichment
        if: github.ref == 'refs/heads/main'
        run: |
          python scripts/test_h2h_history_research.py
          python scripts/h2h_history_research.py --apply

      - name: Takim isimleri birim testi
        run: python scripts/test_match_odds.py

      - name: Mac eslestirme kontrolu
        run: python scripts/match_odds.py

      - name: Piyasa olasiligi analizi
        run: python scripts/market_analysis.py

      - name: Piyasa gecmisini arsivle
        run: python scripts/archive_market.py

      - name: V4.3 Backtest ve model dogrulama un
        run: |
          python scripts/backtest.py
          python scripts/validate_model.py

      - name: V4.64 automatic Championship results
        if: github.ref == 'refs/heads/main'
        run: |
          python scripts/test_automatic_results.py
          python scripts/automatic_results.py
      - name: V4.69 nine league automatic results
        if: github.ref == 'refs/heads/main'
        run: |
          python scripts/test_multi_league_results.py
          python scripts/multi_league_results.py
      - name: V4.4 Prospektif model dogrulama
        run: |
          python scripts/test_prospective_markets.py
          python scripts/test_prospective_capture_window.py
          python scripts/prospective_validation.py
          python scripts/test_prospective_leagues.py
          python scripts/prospective_leagues.py

      - name: Tahmin performansini takip et
        run: python scripts/track_performance.py
      - name: V4.5 Veri kalite kontrolu
        run: python scripts/data_quality.py
      - name: V4.6 Karar motoru
        run: python scripts/decision_engine.py
      - name: V4.8 Shadow tests
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ortak-analiz-v4-8'
        run: python scripts/test_shadow_performance.py
      - name: V4.8 Shadow pipeline
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ortak-analiz-v4-8'
        run: |
          python scripts/shadow_coupon.py
          python scripts/shadow_results.py
          python scripts/shadow_performance.py
      - name: V4.9 Research 1.5 totals
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ortak-analiz-v4-8'
        run: python scripts/market_analysis_15.py
      - name: V4.60 calendar research report
        if: github.ref == 'refs/heads/main'
        run: |
          python scripts/test_fixture_reconciliation.py
          python scripts/fixture_reconciliation.py
      - name: V4.8 Save shadow reports
        if: github.ref == 'refs/heads/ortak-analiz-v4-8'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f fixture_reconciliation.json ]; then git add fixture_reconciliation.json; fi
          git add daily.json odds.json matching.json market_analysis.json market_analysis_15.json shadow_coupon.json shadow_archive.json shadow_verified_results.json shadow_results_status.json shadow_performance.json
          if ! git diff --cached --quiet; then
            git commit -m "Update V4.8 shadow reports"
            git push
          fi
      - name: V4.17 Calibration diagnostics
        if: github.ref == 'refs/heads/main'
        run: |
          python scripts/test_calibration.py
          python scripts/calibration.py
      - name: V4.20 Model research
        if: github.ref == 'refs/heads/main'
        run: |
          python scripts/test_model_research.py
          python scripts/model_research.py
      - name: V4.9 Live Extra Markets Pilot
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ortak-analiz-v4-8'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/test_extra_markets.py
          python scripts/fetch_extra_markets.py
          cat extra_markets.json

      - name: Upload V4.9 Live Report
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ortak-analiz-v4-8'
        uses: actions/upload-artifact@v4
        with:
          name: extra-markets-pilot
          path: extra_markets.json
          retention-days: 7

      - name: V4.10 Archive Extra Markets
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ortak-analiz-v4-8'
        run: |
          python scripts/test_archive_extra_markets.py
          python scripts/archive_extra_markets.py

          if [ -f extra_market_archive.json ]; then
            git add extra_market_archive.json
            if ! git diff --cached --quiet; then
              git commit -m "Update V4.10 extra market archive"
              git push
            fi
          fi
      - name: V4.11 Market Movement
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ortak-analiz-v4-8')
        run: |
          python scripts/test_market_movement.py
          python scripts/market_movement.py
          cat market_movement.json

      - name: V4.12 Model Market Comparison
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ortak-analiz-v4-8')
        run: |
          python scripts/test_model_market.py
          python scripts/model_market.py
          cat model_market.json

      - name: V4.13 Unified Decision
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ortak-analiz-v4-8')
        run: |
          python scripts/test_unified_decision.py
          python scripts/unified_decision.py
          cat unified_decision.json


      - name: V4.71 archive calendar evidence
        if: github.ref == 'refs/heads/main'
        run: |
          python scripts/test_archive_calendar_evidence.py
          python scripts/archive_calendar_audit.py
          python scripts/archive_calendar_evidence.py
      - name: V4.72 corrected date result research
        if: github.ref == 'refs/heads/main'
        run: |
          python scripts/test_archive_calendar_result_replay.py
          python scripts/archive_calendar_result_replay.py
      - name: V4.83 persistent calendar outcome quarantine
        if: github.ref == 'refs/heads/main'
        run: |
          python scripts/test_archive_calendar_outcomes.py
          python scripts/archive_calendar_outcomes.py
      - name: V4.80 score provenance and conflict audit
        if: github.ref == 'refs/heads/main'
        run: |
          python scripts/test_score_provenance.py
          python scripts/score_provenance.py
      - name: V4.90 scoreboard snapshot
        if: github.ref == 'refs/heads/main'
        run: |
          python scripts/test_scoreboard_snapshot.py
          python scripts/scoreboard_snapshot.py
      - name: V4.92 upcoming fixture source comparison
        if: github.ref == 'refs/heads/main'
        run: |
          python scripts/test_fixture_coverage_audit.py
          python scripts/fixture_coverage_audit.py
      - name: V4.94 kickoff agreement research
        if: github.ref == 'refs/heads/main'
        run: |
          python scripts/test_kickoff_confirmation.py
          python scripts/kickoff_confirmation.py
      - name: V5.10 international fixtures and historical statistics
        if: github.ref == 'refs/heads/main'
        run: |
          python scripts/test_football_coverage_pilot.py
          python scripts/test_football_statistics_pilot.py
          python scripts/football_coverage_pilot.py --allow-empty
          python scripts/football_statistics_pilot.py --allow-empty
      - name: V5.35 historical research publication checks
        if: github.ref == 'refs/heads/main'
        run: |
          python scripts/test_football_context_manifest.py
          python scripts/test_football_context_research.py
          python scripts/test_historical_metric_coverage.py
          python scripts/football_context_research.py
          python scripts/historical_metric_coverage.py
          python scripts/test_chronological_statistics_research.py
          python scripts/chronological_statistics_research.py
          python scripts/football_context_manifest.py
          python scripts/test_fixture_data_quality.py
          python scripts/fixture_data_quality.py
      - name: V7.08 additional football historical statistics
        if: github.ref == 'refs/heads/main'
        run: |
          python scripts/test_extra_historical_metric_coverage.py
          python scripts/extra_historical_metric_coverage.py --allow-empty
      - name: V4.93 20-file release and source integrity
        if: github.ref == 'refs/heads/main'
        run: |
          python scripts/test_snapshot_integrity.py
          python scripts/test_publication_retry.py
          python scripts/snapshot_integrity.py
      - name: V6.63 observed totals history
        if: github.ref == 'refs/heads/main'
        run: |
          python scripts/test_observed_totals_history.py
          python scripts/observed_totals_history.py
      - name: V6.7 Read-only source health report
        if: github.ref == 'refs/heads/main'
        run: |
          python scripts/market_data_health.py --self-test
          python scripts/market_data_health.py
      - name: V6.7 Upload source health evidence
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: publication-source-health
          path: market_data_health.json
          retention-days: 7
      - name: V4.61 Publish complete snapshot
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ortak-analiz-v4-8')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if [ -f extra_market_archive.json ]; then git add extra_market_archive.json; fi
            if [ -f extra_markets.json ]; then git add extra_markets.json; fi
            if [ -f odds_last_good.json ]; then git add odds_last_good.json; fi
            if [ -f odds_continuity.json ]; then git add odds_continuity.json; fi
            if [ -f football_history_cache.json ]; then git add football_history_cache.json; fi
            git add extra_historical_metric_coverage.json
            git add observed_totals_history.json observed_totals_report.json market_data_health.json fixture_data_quality.json chronological_statistics_research.json football_context_research.json historical_metric_coverage.json h2h_history_research.json football_context_manifest.json daily.json odds.json matching.json market_analysis.json market_analysis_15.json shadow_coupon.json shadow_archive.json shadow_verified_results.json shadow_results_status.json shadow_performance.json fixture_reconciliation.json archive_calendar_audit.json archive_calendar_evidence.json archive_calendar_evidence_status.json archive_calendar_result_replay.json archive_calendar_outcomes.json archive_calendar_outcome_status.json snapshot_integrity.json score_provenance.json results_source_pilot.json multi_league_results.json backtest.json prediction_archive.json performance.json market_archive.json validation.json prospective_archive.json prospective_validation.json prospective_leagues.json scoreboard_snapshot.json fixture_coverage_audit.json kickoff_confirmation.json data_quality.json decision.json calibration.json model_research.json football_coverage_pilot.json football_statistics_pilot.json
          fi
          git add market_movement.json model_market.json unified_decision.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish complete analysis snapshot"
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 5
              git fetch origin "$GITHUB_REF_NAME"
              # Permit only isolated research ledger changes; never rebase across analysis inputs.
              if [ "$(git rev-parse FETCH_HEAD)" != "$(git rev-parse HEAD^)" ]; then
                if [ "$GITHUB_REF" != "refs/heads/main" ] || ! python scripts/publication_retry.py HEAD^ FETCH_HEAD; then
                  echo "Remote advanced; refusing to publish stale snapshot"
                  exit 1
                fi
                git rebase FETCH_HEAD || { git rebase --abort; exit 1; }
              fi
            done
          fi

      - name: V4.53 Published coverage summary
        if: github.ref == 'refs/heads/main'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          daily=json.loads(Path("daily.json").read_text())
          odds=json.loads(Path("odds.json").read_text())
          decision=json.loads(Path("unified_decision.json").read_text())
          tr=next((x for x in daily.get("leagueDiagnostics",[]) if x.get("league")=="Türkiye Süper Lig"),{})
          print("## Published data coverage")
          print("Report date:",daily.get("updatedAt"))
          print("Fixture leagues:",daily.get("leaguesLoaded"),"/",daily.get("leaguesChecked"))
          print("Odds leagues queried:",len(odds.get("queriedLeagues",[])))
          print("Turkey completed matches:",tr.get("completedMatches"))
          print("Turkey odds events:",sum(x.get("league")=="soccer_turkey_super_league" for x in odds.get("events",[])))
          print("Remaining API credits:",odds.get("remainingCredits"))
          print("Decision:",decision.get("decision"),"; real betting enabled:",decision.get("realBettingEnabled"))
          PY
