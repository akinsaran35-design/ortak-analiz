name: Ortak Analiz Gunluk

on:
  schedule:
    - cron: '0 5,15 * * *'
  workflow_dispatch:

concurrency:
  group: ortak-analiz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Odds API baglanti testi
        if: github.ref == 'refs/heads/ortak-analiz-v2-5'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/odds_probe.py

      - name: Uluslararasi oranlari al
        if: github.ref != 'refs/heads/ortak-analiz-v2-8' && github.ref != 'refs/heads/ortak-analiz-v2-9' && github.ref != 'refs/heads/ortak-analiz-v3-0'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/fetch_odds.py

      - name: Performans motoru birim testi
        run: python scripts/test_track_performance.py

      - name: Gunluk analizi calistir
        run: python scripts/daily_analysis.py

      - name: Takim isimleri birim testi
        run: python scripts/test_match_odds.py

      - name: Mac eslestirme kontrolu
        run: python scripts/match_odds.py

      - name: Piyasa olasiligi analizi
        run: python scripts/market_analysis.py

      - name: Piyasa gecmisini arsivle
        run: python scripts/archive_market.py

      - name: V4.3 Backtest ve model dogrulama
        run: python scripts/validate_model.py

      - name: V4.4 Prospektif model dogrulama
        run: python scripts/prospective_validation.py

      - name: Tahmin performansini takip et
        run: python scripts/track_performance.py

      - name: Raporlari kaydet
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily.json backtest.json prediction_archive.json performance.json odds.json matching.json market_analysis.json market_archive.json validation.json prospective_archive.json prospective_validation.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily analysis and validation"
            git push
          fi
