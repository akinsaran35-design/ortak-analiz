name: Ortak Analiz Gunluk

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Odds API baglanti testi
        if: github.ref == 'refs/heads/ortak-analiz-v2-5'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/odds_probe.py

      - name: Uluslararasi oranlari al
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/fetch_odds.py

      - name: Performans motoru birim testi
        run: python scripts/test_track_performance.py

      - name: Gunluk analizi calistir
        run: python scripts/daily_analysis.py

      - name: Gecmis maclari test et
        run: python scripts/backtest.py

      - name: Tahmin performansini takip et
        run: python scripts/track_performance.py

      - name: Raporlari kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily.json backtest.json prediction_archive.json performance.json odds.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily analysis and backtest"
            git push
          fi
