name: V4.88 League Research Tests
on:
  pull_request:
    paths:
      - 'scripts/prospective_leagues.py'
      - 'scripts/test_prospective_leagues.py'
      - '.github/workflows/league-research-tests.yml'
jobs:
  league-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_prospective_leagues.py
      - run: python scripts/prospective_leagues.py
