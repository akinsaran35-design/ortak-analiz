name: V6.75 market coverage health
on:
  pull_request:
    paths:
      - 'scripts/market_data_health.py'
      - 'scripts/test_market_coverage_health.py'
      - '.github/workflows/market-coverage-health.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/market_data_health.py --self-test
      - run: python scripts/test_market_coverage_health.py
      - run: python scripts/market_data_health.py
      - uses: actions/upload-artifact@v4
        with:
          name: market-coverage-health
          path: market_data_health.json
          if-no-files-found: error
          retention-days: 30
