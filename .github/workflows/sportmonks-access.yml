name: V7.30 Sportmonks access coverage
on:
  pull_request:
    paths:
      - 'scripts/sportmonks_access_probe.py'
      - 'scripts/test_sportmonks_access_probe.py'
      - '.github/workflows/sportmonks-access.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test_sportmonks_access_probe.py
      - if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: python3 scripts/sportmonks_access_probe.py
