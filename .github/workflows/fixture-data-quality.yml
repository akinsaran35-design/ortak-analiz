name: V5.37 fixture data quality
on:
  pull_request:
    paths:
      - 'scripts/fixture_data_quality.py'
      - 'scripts/test_fixture_data_quality.py'
      - '.github/workflows/fixture-data-quality.yml'
      - '.github/workflows/daily.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_fixture_data_quality.py
      - run: python scripts/fixture_data_quality.py
      - uses: actions/upload-artifact@v4
        with:
          name: fixture-data-quality
          path: fixture_data_quality.json
          if-no-files-found: error
          retention-days: 7
