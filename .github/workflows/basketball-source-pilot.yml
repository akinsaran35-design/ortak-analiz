name: V5.05 NBA source pilot
on:
  pull_request:
    paths:
      - 'scripts/basketball_source_pilot.py'
      - 'scripts/test_basketball_source_pilot.py'
      - '.github/workflows/basketball-source-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_basketball_source_pilot.py
      - run: python scripts/basketball_source_pilot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-source-pilot
          path: basketball_source_pilot.json
          if-no-files-found: ignore
          retention-days: 7
