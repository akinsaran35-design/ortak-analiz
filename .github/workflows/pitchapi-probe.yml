name: V6.51a PitchAPI alternative source probe
on:
  pull_request:
    paths:
      - 'scripts/pitchapi_probe.py'
      - 'scripts/test_pitchapi_probe.py'
      - '.github/workflows/pitchapi-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/test_pitchapi_probe.py
  probe:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Probe league catalogue
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: python scripts/pitchapi_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: pitchapi-connection-report
          path: pitchapi_connection_report.json
          if-no-files-found: error
          retention-days: 30
