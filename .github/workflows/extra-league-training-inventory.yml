name: V6.49 historical training inventory
on:
  pull_request:
    paths:
      - 'scripts/extra_league_training_inventory.py'
      - 'scripts/test_extra_league_training_inventory.py'
      - '.github/workflows/extra-league-training-inventory.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/extra_league_training_inventory.py'
      - 'scripts/test_extra_league_training_inventory.py'
      - '.github/workflows/extra-league-training-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/test_extra_league_training_inventory.py
      - run: python scripts/extra_league_training_inventory.py
      - uses: actions/upload-artifact@v4
        with:
          name: extra-training-inventory
          path: |
            extra_training_inventory.json
            extra_training_candidates.json
          if-no-files-found: error
          retention-days: 30
