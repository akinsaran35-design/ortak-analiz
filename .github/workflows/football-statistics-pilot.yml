name: V5.09 football historical statistics
on:
  pull_request:
    paths:
      - 'scripts/football_statistics_pilot.py'
      - 'scripts/test_football_statistics_pilot.py'
      - '.github/workflows/football-statistics-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_football_statistics_pilot.py
      - run: python scripts/football_statistics_pilot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-statistics-pilot
          path: football_statistics_pilot.json
          if-no-files-found: ignore
          retention-days: 7
