name: V6.65 main leagues ML research
on:
  pull_request:
    paths:
      - 'scripts/main_leagues_ml_research.py'
      - 'scripts/test_main_leagues_ml_research.py'
      - '.github/workflows/main-leagues-ml-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'catboost==1.2.8' 'numpy==2.2.6' 'scipy==1.15.3'
      - run: python scripts/test_main_leagues_ml_research.py
      - run: python scripts/main_leagues_ml_research.py
      - uses: actions/upload-artifact@v4
        with:
          name: main-leagues-ml-research
          path: main_leagues_ml_research.json
          if-no-files-found: error
          retention-days: 90
